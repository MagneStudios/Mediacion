server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

  # Bundles under /_expo carry a content hash in the filename, so they can be
  # cached forever. A miss here must 404 rather than fall through to index.html:
  # returning HTML for a missing .js would surface as a confusing parse error.
  location /_expo/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }

  # The HTML entry points must never be cached, or a deploy leaves clients
  # loading bundle filenames that no longer exist.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # `expo export` emits dynamic routes with the literal segment in the path
  # (dist/case/[id]/agreement/index.html), so a real URL like
  # /case/7f3a.../agreement matches no file. The final fallback hands those to
  # index.html and expo-router resolves the route client-side from
  # window.location.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
