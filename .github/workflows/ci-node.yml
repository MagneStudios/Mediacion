name: ci-node

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm tsc -b
      - run: pnpm -r test

  # Runs the twelve *.integration.spec.ts suites, which gate themselves on
  # DATABASE_URL and were therefore skipped on every run before this job existed.
  #
  # This is the job that would have caught the audit_trigger_func regression:
  # `SET search_path = ''` with an unqualified `auditoria` only fails when the
  # trigger actually fires, so scripts/smoke_migrations.py — which checks that the
  # function EXISTS — reported it healthy while every write to an audited table
  # returned 500 in production.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The isolation matrix signs its own tokens with this, and the app verifies
      # against it. Unset, every request stops at 401 before reaching the
      # authorisation logic under test.
      SUPABASE_JWT_SECRET: ci-only-secret-not-used-anywhere-else
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply the schema
        run: bash scripts/apply-migrations.sh

      # Existence checks are not sufficient on their own, but they localise a
      # migration that applied and still produced the wrong shape.
      - name: Smoke-check the schema
        run: |
          python3 -m pip install --quiet psycopg2-binary
          python3 scripts/smoke_migrations.py

      # Proves the audited write path end to end: the trigger fires, resolves
      # public.auditoria and records the row. A bare INSERT is enough — it is
      # exactly the operation that was returning 500 in production.
      - name: Exercise the audit and provisioning triggers
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES ('11111111-1111-1111-1111-111111111111', 'ci@test.local',
                  '{"nombre":"CI","apellido":"Test"}'::jsonb);
          INSERT INTO casos (nombre, metodo, creador_id)
          VALUES ('ci audit probe', 'negociacion',
                  '11111111-1111-1111-1111-111111111111');
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM auditoria
                           WHERE accion = 'INSERT_casos' AND entidad = 'casos') THEN
              RAISE EXCEPTION 'audit_trigger_func did not record the INSERT into casos';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM usuarios
                           WHERE id = '11111111-1111-1111-1111-111111111111') THEN
              RAISE EXCEPTION 'on_auth_user_created did not provision public.usuarios';
            END IF;
          END
          $$;
          SQL

      - run: pnpm --filter @mediacion/api test

  # Neither image was ever built in CI, which is how a Dockerfile that could not
  # build from a clean clone stayed green through three releases. Build only —
  # nothing is pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t mediacion-api:ci .

      # The three EXPO_PUBLIC_* values are inlined into the bundle at build time
      # and the Dockerfile refuses to build without them. These are placeholders:
      # the job proves the image builds, not that it points anywhere real.
      - name: Build the web image
        run: |
          docker build -f mediacion-app/Dockerfile -t mediacion-web:ci \
            --build-arg EXPO_PUBLIC_API_URL=http://api.invalid \
            --build-arg EXPO_PUBLIC_SUPABASE_URL=http://supabase.invalid \
            --build-arg EXPO_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
            .

      # A bundle that builds but inlines nothing is the failure this guards
      # against: the site looks healthy and every request goes to undefined. That
      # shipped to production once already.
      - name: Verify the web bundle inlined its configuration
        run: |
          docker run --rm --entrypoint sh mediacion-web:ci -c '
            bundle=$(ls /usr/share/nginx/html/_expo/static/js/web/*.js | head -1)
            for value in api.invalid supabase.invalid ci-placeholder-anon-key; do
              if ! grep -q "$value" "$bundle"; then
                echo "ERROR: $value is absent from the bundle." >&2
                exit 1
              fi
            done
            test -f /usr/share/nginx/html/login.html
            test -f /usr/share/nginx/html/signup.html
            echo "bundle carries its configuration and emits the auth routes"
          '
